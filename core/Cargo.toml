[package]
name = "omsi-tools-core"
description = "Map scanning and cleanup logic for OMSI 2, neoOMSI and openOMSI (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
trash = "5"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
