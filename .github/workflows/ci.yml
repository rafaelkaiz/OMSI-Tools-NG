name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libwayland-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p app

  release-linux:
    name: Linux release package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libwayland-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p app
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="OMSI-Tools-NG-${VERSION}-linux-x64"
          mkdir "$DIR"
          cp target/release/app "$DIR/OMSI-Tools-NG"
          chmod +x "$DIR/OMSI-Tools-NG"
          cp LICENSE README.md CHANGELOG.md "$DIR/"
          tar -czf "$DIR.tar.gz" "$DIR"
          echo "ASSET=$DIR.tar.gz" >> "$GITHUB_ENV"
          # release notes = the matching CHANGELOG section
          awk -v v="## ${VERSION}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" $PRE \
              --title "OMSI-Tools-NG ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
